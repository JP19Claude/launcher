name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so earlier versions can be read for the per-app releases.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs (Hearth, Glimmer, Clawd, Hearth UI)
        run: |
          chmod +x gradlew
          ./gradlew assembleHearthDebug assembleGlimmerDebug assembleClawdDebug assembleOneDebug
          cp app/build/outputs/apk/hearth/debug/app-hearth-debug.apk Hearth.apk
          cp app/build/outputs/apk/glimmer/debug/app-glimmer-debug.apk Glimmer.apk
          cp app/build/outputs/apk/clawd/debug/app-clawd-debug.apk Clawd.apk
          cp app/build/outputs/apk/one/debug/app-one-debug.apk HearthUI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-glimmer-debug-apks
          path: |
            Hearth.apk
            Glimmer.apk
            Clawd.apk
            HearthUI.apk

      # Once: every earlier version of every app as its own release (oldest first, so they
      # line up in order). A marker tag remembers it's done.
      - name: Per-app releases for earlier versions (once)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The marker is in the checkout (all tags come along); asking the API can fail now and
          # then and must not start the whole backfill again.
          if git rev-parse -q --verify refs/tags/per-app-releases-done >/dev/null || \
             gh api "repos/$REPO/git/refs/tags/per-app-releases-done" >/dev/null 2>&1; then
            echo "Already done."
            exit 0
          fi
          # The last build of each version wins (some versions were built twice).
          declare -A last
          for n in $(gh release list --limit 300 --json tagName --jq '.[].tagName' | grep '^build-[0-9]*$' | sed 's/^build-//' | sort -n); do
            sha=$(gh release view "build-$n" --json targetCommitish --jq .targetCommitish)
            v=$(git show "$sha:app/build.gradle.kts" 2>/dev/null | grep -o 'versionName = "[^"]*"' | cut -d'"' -f2)
            [ -n "$v" ] && last[$v]="$n $sha"
          done
          for n in $(for v in "${!last[@]}"; do echo "${last[$v]%% *}"; done | sort -n); do
            sha=$(gh release view "build-$n" --json targetCommitish --jq .targetCommitish)
            v=$(git show "$sha:app/build.gradle.kts" | grep -o 'versionName = "[^"]*"' | cut -d'"' -f2)
            dir=$(mktemp -d)
            gh release download "build-$n" -D "$dir"
            for entry in "Hearth.apk|hearth|Hearth|der Launcher" \
                         "Glimmer.apk|glimmer|Glimmer|die Insel um die Kamera" \
                         "Kontrollzentrum.apk|kontrollzentrum|Kontrollzentrum|das Glas-Kontrollzentrum über allen Apps"; do
              IFS='|' read -r file slug name what <<< "$entry"
              [ -f "$dir/$file" ] || continue
              tag="$slug-v$v"
              gh release view "$tag" >/dev/null 2>&1 && continue
              cp "$dir/$file" "$dir/$name-$v.apk"
              # Tagged on this commit: the build token may not tag old commits (their
              # workflow file differs); the notes name the commit the APK was built from.
              gh release create "$tag" "$dir/$name-$v.apk" \
                --target "$GITHUB_SHA" \
                --title "$name $v" \
                --notes "$name $v – $what. Debug-APK aus Build $n (Commit $sha)." \
                --latest=false
            done
            rm -rf "$dir"
          done
          gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/per-app-releases-done -f sha="$GITHUB_SHA" >/dev/null || true

      # Each app's own release for this version (updated if the version wasn't raised).
      - name: Per-app releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          # file|slug (tag and update check, never changes)|file name|title|what it is
          # (Hearth One became Hearth UI, then OMEGA UI, now ZENITH; its slug stays, so installed apps keep finding it.)
          for entry in "Hearth.apk|hearth|Hearth|Hearth|der Launcher" \
                       "Glimmer.apk|glimmer|Glimmer|Glimmer|die Insel um die Kamera" \
                       "Clawd.apk|clawd|Clawd|Clawd|Clawds Widgets für jeden Launcher, sein Tamagotchi und Chat" \
                       "HearthUI.apk|hearthone|ZENITH|ZENITH|Launcher, Glimmer und Clawd in einer App"; do
            IFS='|' read -r file slug name title what <<< "$entry"
            tag="$slug-v$v"
            cp "$file" "$name-$v.apk"
            # What's new (German, shown in each app's software update screen), then the build.
            whatsnew=""
            if [ -f .github/whatsnew.md ]; then whatsnew="$(cat .github/whatsnew.md)"; fi
            notes="$(printf '%s\n\n%s\n\nDebug-APK aus Build %s (Commit %s).' "$title $v – $what." "$whatsnew" "${{ github.run_number }}" "${{ github.sha }}")"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$name-$v.apk" --clobber
              gh release edit "$tag" --notes "$notes" --latest=false
            else
              gh release create "$tag" "$name-$v.apk" \
                --target "${{ github.sha }}" \
                --title "$title $v" \
                --notes "$notes" \
                --latest=false
            fi
          done

      # All three together, marked as latest: the download links in the apps and the README
      # (releases/latest/download/…) point here.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What's newest, for the apps' update check: a plain file (no GitHub API, so no
          # limit on how often phones may ask).
          v=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          python3 - "$v" "${{ github.repository }}" "build-${{ github.run_number }}" <<'PY'
          import json, os, sys
          v, repo, tag = sys.argv[1:4]
          notes = open(".github/whatsnew.md").read().strip() if os.path.exists(".github/whatsnew.md") else ""
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          out = {"version": v, "notes": notes}
          for slug, file in [("hearth", "Hearth.apk"), ("glimmer", "Glimmer.apk"), ("clawd", "Clawd.apk"), ("hearthone", "HearthUI.apk")]:
              out[slug] = {"version": v, "url": base + file, "size": os.path.getsize(file)}
          json.dump(out, open("versions.json", "w"), ensure_ascii=False, indent=1)
          PY
          gh release create "build-${{ github.run_number }}" Hearth.apk Glimmer.apk Clawd.apk HearthUI.apk versions.json \
            --target "${{ github.sha }}" \
            --title "Hearth Build ${{ github.run_number }}" \
            --notes "HearthUI.apk (ZENITH: alles in einer App), Hearth.apk (Launcher), Glimmer.apk (Insel) und Clawd.apk (Clawds Widgets für jeden Launcher). Debug-APKs vom Branch ${{ github.ref_name }}, Commit ${{ github.sha }}." \
            --latest
