name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Hearth.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-debug-apk
          path: Hearth.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Hearth.apk \
            --target "${{ github.sha }}" \
            --title "Hearth Build ${{ github.run_number }}" \
            --notes "Debug-APK vom Branch ${{ github.ref_name }}, Commit ${{ github.sha }}." \
            --latest
